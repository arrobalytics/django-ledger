{% load i18n %}
<div id="{{ html_id }}" class="modal">
    <div class="modal-background"></div>
    <div class="modal-content">
        <div class="card">
            <div class="card-content"><p class="is-size-4 has-font-weight-light">{{ message }}</p></div>
            <div class="card-footer">
                <a onclick="djLedger.toggleModal('{{ html_id }}')"
                   class="card-footer-item has-background-success-light">{% trans 'Cancel' %}</a>
                {% if http_method == 'post' %}
                    <form name="djl-action-form-{{ html_id }}"
                          id="djl-action-form-{{ html_id }}"
                          method="post"
                          action="{{ action_url }}"
                          style="display:none">
                        {% csrf_token %}
                    </form>
                    <a onclick="djLedger.submitForm('djl-action-form-{{ html_id }}', '{{ html_id }}')"
                       class="card-footer-item has-background-info-light">{% trans 'Confirm' %}</a>
                {% else %}
                    {# Legacy GET confirm — only used when callers pass http_method='get' #}
                    <a href="{{ action_url }}"
                       class="card-footer-item has-background-info-light">{% trans 'Confirm' %}</a>
                {% endif %}
            </div>
        </div>
    </div>

    <button class="modal-close is-large"
            aria-label="close"
            onclick="djLedger.toggleModal('{{ html_id }}')">
    </button>
</div>
